services:
  postgres:
    # Limit logs size to prevent disk exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Expose internally to host on port 5433 to prevent port conflicts with host's standard postgres (5432)
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  meilisearch:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nextjs:
    # Set production resource limits
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
