# Cache zone for Next.js static assets
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost; # In production, replace with your domain

    # HTTP to HTTPS redirect placeholder (Cloudflare or Let's Encrypt SSL configuration)
    # In production, once SSL is ready, uncomment this redirect and comment out the proxy location below.
    # return 301 https://$host$request_uri;

    # Direct proxying on HTTP before SSL setup
    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

