# ==============================================================================
# PostgreSQL Production Tuning Configuration
# Optimized for a single host instance (e.g. 1GB - 2GB DigitalOcean Droplet)
# ==============================================================================

# Memory Settings
shared_buffers = 256MB                 # ~25% of 1GB total RAM
work_mem = 4MB                         # Memory for sorting & hash operations
maintenance_work_mem = 64MB            # Memory for vacuum, index create, etc.
effective_cache_size = 768MB           # System cache estimation (~75% of RAM)

# Connections
listen_addresses = '*'                 # Listen on all interfaces inside Docker network
max_connections = 100                  # Max concurrent client connections
superuser_reserved_connections = 3     # Reserve slots for admin operations

# Encoding and Timezone
client_encoding = 'UTF8'
default_transaction_isolation = 'read committed'
timezone = 'UTC'

# Logging Configurations
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250       # Log slow queries taking more than 250ms

# Write-Ahead Log (WAL) & Checkpoints
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9     # Balance disk I/O spikes
checkpoint_timeout = 15min             # Sync checkpoint frequency
