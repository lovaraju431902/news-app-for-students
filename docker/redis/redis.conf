# ==============================================================================
# Redis Production Configuration
# ==============================================================================

# Network settings
port 6379
bind 0.0.0.0

# Security setting (Forces password requirement, specified dynamically via docker-compose)
protected-mode yes

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Snapshotting backup schedule
save 900 1
save 300 10
save 60 10000

# Working directory for AOF/snapshots
dir /data
